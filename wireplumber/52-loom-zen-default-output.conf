# Do not restore an old manually selected device for Zen streams.
# Restores volume normally; only the per-app output target is exempt.
stream.rules = [
  {
    matches = [
      { media.class = "Stream/Output/Audio" application.name = "Zen" }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }
]
